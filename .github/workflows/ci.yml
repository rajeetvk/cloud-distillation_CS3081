name: CI Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      evaluate_bad_model:
        description: 'Set to true to test quality gate failure with untrained model'
        required: false
        default: 'false'

jobs:
  # 1. Secret Scanning
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Linting
  lint:
    name: Linting
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Lint
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,build,dist
          # Exit-zero treats all other warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.git,__pycache__,build,dist

  # 3. Unit Tests (At least 3 tests)
  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r service/requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  # 4. Model Evaluation & Quality Gate
  model-evaluation:
    name: Model Evaluation and Quality Gate
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inference & Evaluation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r service/requirements.txt

      - name: Download Model Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_BAD: ${{ github.event.inputs.evaluate_bad_model }}
        run: |
          mkdir -p models/v1
          if [ "$EVAL_BAD" = "true" ]; then
            echo "Running quality gate failure test with untrained Pythia-70M..."
            python -c "from transformers import AutoTokenizer, AutoModelForCausalLM; AutoTokenizer.from_pretrained('EleutherAI/pythia-70m').save_pretrained('models/v1'); AutoModelForCausalLM.from_pretrained('EleutherAI/pythia-70m').save_pretrained('models/v1')"
          else
            echo "Downloading trained model release asset..."
            # Try downloading from GitHub Release if available, else fallback to HF / repository asset
            gh release download v1.0.0 --dir models/v1 || python -c "from transformers import AutoTokenizer, AutoModelForCausalLM; AutoTokenizer.from_pretrained('EleutherAI/pythia-70m').save_pretrained('models/v1'); AutoModelForCausalLM.from_pretrained('EleutherAI/pythia-70m').save_pretrained('models/v1')"
          fi

      - name: Generate Predictions on Validation Set
        run: |
          python -c "
          import json, torch
          from transformers import AutoTokenizer, AutoModelForCausalLM
          
          tokenizer = AutoTokenizer.from_pretrained('models/v1')
          if tokenizer.pad_token is None:
              tokenizer.pad_token = tokenizer.eos_token
          model = AutoModelForCausalLM.from_pretrained('models/v1')
          model.eval()
          
          preds = []
          with open('data/validation.jsonl', 'r', encoding='utf-8') as f:
              for line in f:
                  item = json.loads(line)
                  prompt = f\"Command: {item['text'].strip()}\nJSON:\"
                  inputs = tokenizer(prompt, return_tensors='pt')
                  with torch.no_grad():
                      out = model.generate(**inputs, max_new_tokens=64, do_sample=False, pad_token_id=tokenizer.eos_token_id)
                  gen = tokenizer.decode(out[0][inputs.input_ids.shape[1]:], skip_special_tokens=True).strip()
                  preds.append({'id': item['id'], 'prediction': gen.split('\n')[0].strip()})
          
          with open('predictions.jsonl', 'w', encoding='utf-8') as f:
              for p in preds:
                  f.write(json.dumps(p) + '\n')
          "

      - name: Quality Gate (score.py --min-validity 95)
        run: |
          python tools/score.py predictions.jsonl data/validation.jsonl --out results/ci_evaluation.json --min-validity 95
