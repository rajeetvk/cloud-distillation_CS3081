apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-0
  namespace: pipeline
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: worker
        shard: "0"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: cloud-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: TEACHER_URL
              value: "http://192.168.65.254:11434"
            - name: S3_ENDPOINT
              value: "http://seaweedfs.data.svc.cluster.local:8333"
            - name: INPUT_PATH
              value: "/app/data/commands_pool.jsonl"
            - name: PROMPT_PATH
              value: "/app/prompts/teacher_prompt.txt"
            - name: OUTPUT_DIR
              value: "/tmp/datasets/teacher"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-1
  namespace: pipeline
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: worker
        shard: "1"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: cloud-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              value: "1"
            - name: SHARD_COUNT
              value: "2"
            - name: TEACHER_URL
              value: "http://192.168.65.254:11434"
            - name: S3_ENDPOINT
              value: "http://seaweedfs.data.svc.cluster.local:8333"
            - name: INPUT_PATH
              value: "/app/data/commands_pool.jsonl"
            - name: PROMPT_PATH
              value: "/app/prompts/teacher_prompt.txt"
            - name: OUTPUT_DIR
              value: "/tmp/datasets/teacher"
